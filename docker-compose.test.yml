version: '3.8'

services:
  userstest:
      build: .
      container_name: userstest
      restart: unless-stopped
      environment:
        REDIS_HOST: host.docker.internal:6379
        DB_HOST:  host.docker.internal
        DB_PORT: 5432
        DB_USER: postgres
        DB_PASSWORD: 123
        DB_NAME: bubble
      ports:
        - "8086:8086"